server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare-Pages-like behavior: trailing-slash routing
    # The Next.js static export already produces /path/index.html files,
    # so this is mostly about clean URLs and 404 fallback.

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Long-term cache for static assets
    location ~* \.(?:css|js|woff2?|ttf|eot|jpg|jpeg|gif|png|webp|avif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML files: short cache
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # English default locale: /en/* permanently redirects to unprefixed paths
    rewrite ^/en/?(.*)$ /$1 permanent;

    # Trailing-slash routing for the static export
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /404.html;
    }

    # 404 fallback
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
